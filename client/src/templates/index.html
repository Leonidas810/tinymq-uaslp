<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Dashboard de Sensores</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.min.js">
  integrity="sha384-mVWmnfLwr+1aO+tDzQaR5dIIGUPFdAfKqLgAW7p0uUb5c1WZZkO5UuVRNvph06V3"
    crossorigin="anonymous"></script>
  <style>
    body {
      font-family: sans-serif;
      padding: 2rem;
      background: #f2f2f2;
    }
    h1 {
      color: #003153;
    }
    #messages {
      margin-top: 1rem;
      padding: 1rem;
      background: white;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    .topic {
      margin-bottom: 1rem;
    }
    .topic-title {
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>Datos en Tiempo Real</h1>
  <div id="messages"></div>

  <script>
    const socket = io();

    socket.on('sensor_update', data => {
      const messagesDiv = document.getElementById('messages');
      
      for (const topic in data) {
        let topicDiv = document.getElementById(topic);
        
        if (!topicDiv) {
          topicDiv = document.createElement('div');
          topicDiv.className = 'topic';
          topicDiv.id = topic;
          
          const title = document.createElement('div');
          title.className = 'topic-title';
          title.innerText = `Tópico: ${topic}`;
          topicDiv.appendChild(title);

          const content = document.createElement('div');
          content.className = 'topic-content';
          topicDiv.appendChild(content);
          
          messagesDiv.appendChild(topicDiv);
        }

        topicDiv.querySelector('.topic-content').innerText = `Mensaje: ${data[topic]}`;
      }
    });
  </script>
</body>
</html>
